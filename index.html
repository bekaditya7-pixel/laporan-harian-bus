<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian Bus Hiba Utama</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-5">
<h1 class="text-2xl font-bold text-center">Laporan Harian Bus</h1>
<p class="text-center text-sm text-gray-500 mb-4">Hiba Utama - Laporan Harian</p>

<label class="text-sm font-bold">Tanggal</label>
<input id="tanggal" type="date" class="w-full border p-3 rounded-xl mt-1 mb-3">

<label class="text-sm font-bold">No Unit / No Bus</label>
<input id="unit" type="text" placeholder="Contoh: B 1234" class="w-full border p-3 rounded-xl mt-1 mb-3">

<label class="text-sm font-bold">Nama Driver</label>
<input id="driver" type="text" placeholder="Nama driver" class="w-full border p-3 rounded-xl mt-1 mb-3">

<label class="text-sm font-bold">Kernet / Kondektur</label>
<input id="kernet" type="text" placeholder="Nama kernet" class="w-full border p-3 rounded-xl mt-1 mb-3">

<label class="text-sm font-bold">Rute / Trayek</label>
<input id="rute" type="text" placeholder="Contoh: Jakarta - Merak" class="w-full border p-3 rounded-xl mt-1 mb-3">

<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-sm font-bold">KM Awal</label>
<input id="kmAwal" type="number" placeholder="Contoh: 25" class="w-full border p-3 rounded-xl mt-1 mb-3">
</div>
<div>
<label class="text-sm font-bold">KM Akhir</label>
<input id="kmAkhir" type="number" placeholder="Contoh: 150" class="w-full border p-3 rounded-xl mt-1 mb-3">
</div>
</div>

<label class="text-sm font-bold">Solar (Liter)</label>
<input id="solar" type="number" placeholder="Contoh: 50" class="w-full border p-3 rounded-xl mt-1 mb-3">

<label class="text-sm font-bold">Setoran (Rp)</label>
<input id="setoran" type="number" placeholder="Contoh: 500000" class="w-full border p-3 rounded-xl mt-1 mb-3">

<label class="text-sm font-bold">Keterangan / Kendala</label>
<textarea id="ket" placeholder="Contoh: Ban bocor, AC mati, dll" class="w-full border p-3 rounded-xl mt-1 mb-3"></textarea>

<button onclick="simpan()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">SIMPAN LAPORAN</button>
<p id="status" class="text-center text-sm mt-2 text-green-600"></p>
</div>

<div id="list" class="max-w-xl mx-auto mt-4 space-y-3"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCurWAV1Ex5ja8WQ--Cpwy5-mAguC7Nou4",
  authDomain: "laporan-harian-bus-hiba-utama.firebaseapp.com",
  databaseURL: "https://laporan-harian-bus-hiba-utama-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laporan-harian-bus-hiba-utama",
  storageBucket: "laporan-harian-bus-hiba-utama.firebasestorage.app",
  messagingSenderId: "980808125025",
  appId: "1:980808125025:web:laporan-harian-bus-hiba-utama"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Set tanggal hari ini otomatis
document.getElementById('tanggal').valueAsDate = new Date();

function simpan(){
  const data = {
    tanggal: document.getElementById('tanggal').value,
    unit: document.getElementById('unit').value,
    driver: document.getElementById('driver').value,
    kernet: document.getElementById('kernet').value,
    rute: document.getElementById('rute').value,
    kmAwal: document.getElementById('kmAwal').value,
    kmAkhir: document.getElementById('kmAkhir').value,
    solar: document.getElementById('solar').value,
    setoran: document.getElementById('setoran').value,
    ket: document.getElementById('ket').value,
    waktu: Date.now()
  };
  if(!data.tanggal || !data.unit || !data.driver){
    alert('Isi dulu Tanggal, No Unit, dan Driver!');
    return;
  }
  db.ref('laporan').push(data).then(()=>{
    document.getElementById('status').innerText = '✅ Berhasil disimpan!';
    document.getElementById('unit').value='';
    document.getElementById('driver').value='';
    document.getElementById('kernet').value='';
    document.getElementById('rute').value='';
    document.getElementById('kmAwal').value='';
    document.getElementById('kmAkhir').value='';
    document.getElementById('solar').value='';
    document.getElementById('setoran').value='';
    document.getElementById('ket').value='';
    setTimeout(()=>{document.getElementById('status').innerText=''},3000);
  }).catch(e=>{ alert('Gagal: '+e.message) });
}

db.ref('laporan').orderByChild('waktu').limitToLast(20).on('value', snap=>{
  const list = document.getElementById('list');
  list.innerHTML = '';
  const val = snap.val();
  if(!val){ list.innerHTML='<p class="text-center text-gray-500">Belum ada laporan</p>'; return; }
  const arr = Object.entries(val).reverse();
  arr.forEach(([key, d])=>{
    const div = document.createElement('div');
    div.className = 'bg-white p-4 rounded-2xl shadow';
    div.innerHTML = `
      <div class="flex justify-between"><b>${d.unit || '-'}</b><span class="text-xs text-gray-500">${d.tanggal || ''}</span></div>
      <p class="text-sm">Driver: ${d.driver || '-'} | Kernet: ${d.kernet || '-'}</p>
      <p class="text-sm">Rute: ${d.rute || '-'}</p>
      <p class="text-sm">KM: ${d.kmAwal || 0} → ${d.kmAkhir || 0} | Solar: ${d.solar || 0} L | Setoran: Rp ${Number(d.setoran||0).toLocaleString('id-ID')}</p>
      <p class="text-sm text-gray-600">${d.ket || ''}</p>
      <button onclick="hapus('${key}')" class="text-red-500 text-xs mt-2 font-bold">HAPUS</button>
    `;
    list.appendChild(div);
  });
});

function hapus(key){
  if(confirm('Hapus laporan ini?')) db.ref('laporan/'+key).remove();
}
</script>
</body>
</html>
