<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian Bus</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<div class="max-w-md mx-auto">
  <div class="bg-blue-600 text-white p-5 rounded-t-2xl text-center">
    <h1 class="text-2xl font-bold">Laporan Harian Bus</h1>
    <p class="text-blue-100 text-sm">Depok - Bandara PP</p>
    <div class="mt-3 bg-white/20 rounded-xl p-3">
      <p class="text-xs">Total Penumpang Hari Ini</p>
      <p id="totalPenumpang" class="text-2xl font-bold">0 Orang</p>
      <p id="totalTrip" class="text-xs">0 Trip</p>
    </div>
  </div>

  <div class="bg-white p-5 rounded-b-2xl shadow">
    <label class="text-sm font-bold">Tanggal</label>
    <input id="tanggal" type="date" class="w-full border p-3 rounded-xl mt-1 mb-3">

    <label class="text-sm font-bold">Rute</label>
    <select id="rute" class="w-full border p-3 rounded-xl mt-1 mb-3">
      <option value="Depok - Bandara">Depok - Bandara</option>
      <option value="Bandara - Depok">Bandara - Depok</option>
    </select>

    <label class="text-sm font-bold">No.Body</label>
    <div class="flex mt-1 mb-3">
      <span class="bg-gray-200 border border-r-0 px-4 flex items-center font-bold rounded-l-xl text-lg">A</span>
      <input id="noBody" type="number" inputmode="numeric" placeholder="47" class="w-full border p-3 rounded-r-xl text-lg font-bold">
    </div>

    <label class="text-sm font-bold">Jam</label>
    <input id="jam" type="time" class="w-full border p-3 rounded-xl mt-1 mb-3">

    <label class="text-sm font-bold">Total Penumpang</label>
    <input id="penumpang" type="number" inputmode="numeric" placeholder="Contoh: 25" class="w-full border p-3 rounded-xl mt-1 mb-3">

    <button onclick="simpan()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">SIMPAN LAPORAN</button>
    <p id="status" class="text-center text-sm mt-2 text-green-600"></p>
  </div>

  <div id="list" class="mt-4 space-y-3"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCurWAV1Ex5ja8WQ--Cpwy5-mAguC7Nou4",
  authDomain: "laporan-harian-bus-hiba-utama.firebaseapp.com",
  databaseURL: "https://laporan-harian-bus-hiba-utama-default-rtdb.firebaseio.com",
  projectId: "laporan-harian-bus-hiba-utama",
  storageBucket: "laporan-harian-bus-hiba-utama.firebasestorage.app",
  messagingSenderId: "980808125025",
  appId: "1:980808125025:web:bdbb62ed2f3a9a48f47820",
  measurementId: "G-BQ9KXRZRNH"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refLaporan = db.ref('laporan');

document.getElementById('tanggal').valueAsDate = new Date();

function simpan(){
  const tanggal = document.getElementById('tanggal').value;
  const rute = document.getElementById('rute').value;
  const noBodyAngka = document.getElementById('noBody').value;
  const jam = document.getElementById('jam').value;
  const penumpang = parseInt(document.getElementById('penumpang').value) || 0;

  if(!tanggal || !noBodyAngka || !jam || !penumpang){
    alert('Isi semua ya Aa!');
    return;
  }
  const noBody = 'A' + noBodyAngka;
  refLaporan.push({ tanggal, rute, noBody, jam, penumpang, createdAt: Date.now() });
  document.getElementById('status').innerText = '✅ Tersimpan! ' + noBody + ' - ' + rute;
  document.getElementById('noBody').value = '';
  document.getElementById('penumpang').value = '';
}

refLaporan.orderByChild('createdAt').on('value', (snap)=>{
  const data = snap.val() || {};
  const list = Object.entries(data).reverse();
  let totalP = 0;
  let html = '';
  list.forEach(([id, v])=>{
    totalP += v.penumpang || 0;
    html += `<div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
      <div>
        <p class="font-bold text-lg">${v.noBody} • ${v.rute}</p>
        <p class="text-sm text-gray-500">${v.tanggal} • Jam ${v.jam}</p>
      </div>
      <div class="text-right">
        <p class="font-bold text-blue-600 text-lg">${v.penumpang} Orang</p>
        <button onclick="hapus('${id}')" class="text-red-500 text-xs">Hapus</button>
      </div>
    </div>`;
  });
  document.getElementById('totalPenumpang').innerText = totalP + ' Orang';
  document.getElementById('totalTrip').innerText = list.length + ' Trip';
  document.getElementById('list').innerHTML = html || '<p class="text-center text-gray-400">Belum ada laporan. Database masih bersih ✨</p>';
});

function hapus(id){ if(confirm('Hapus laporan ini?')) refLaporan.child(id).remove(); }
</script>
</body>
</html>
